parent=keycloak.v2
import=common/keycloak

# Feuille de style personnalisée (remplace keycloak.v2)
styles=css/login.css

# Locale — on force le français (messages_en = mêmes strings FR)
locales=fr,en
defaultLocale=fr

# URL de la plateforme (bouton retour accueil)
frontendUrl=http://localhost:5173

# Scripts additionnels (optionnel)
# scripts=js/login.js

# Propriétés de personnalisation
kcHtmlClass=
kcBodyClass=
kcButtonClass=seed-btn
kcInputClass=seed-input
kcInputWrapperClass=seed-input-wrap
kcFormGroupClass=seed-form-group
kcLabelClass=seed-label
kcLoginClass=seed-login-form
