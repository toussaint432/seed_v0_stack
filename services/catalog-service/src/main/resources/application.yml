server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 30
      min-spare: 5
    connection-timeout: 20000
    accept-count: 100

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seed}
    username: ${SPRING_DATASOURCE_USERNAME:seed}
    password: ${SPRING_DATASOURCE_PASSWORD:seed}
    hikari:
      pool-name: HikariPool-catalog
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        "[default_batch_fetch_size]": 20
  # ── Flyway : catalog-service est le schema owner ──────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0  # 0 = avant V1 → toutes les migrations V1-V7 s'exécutent sur DB fraîche
    out-of-order: false
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 35MB
      file-size-threshold: 2MB
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  jackson:
    serialization:
      write-dates-as-timestamps: false  # Dates ISO-8601 (ex: 2025-06-01T10:00:00Z) au lieu de timestamps Unix
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:18080/realms/seed-v0}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/seed-v0/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

uploads:
  # Répertoire de stockage des PDF (monté via volume Docker)
  dir: ${UPLOADS_DIR:/app/uploads}

cors:
  # Origins autorisées — séparées par virgule ; configurable via env CORS_ALLOWED_ORIGINS
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    "[org.springframework.security]": INFO
