spring:
  # Flyway activé pour les tests — les migrations du catalog-service créent le schéma complet.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: false
  kafka:
    bootstrap-servers: localhost:9999
    producer:
      properties:
        "[max.block.ms]": 500
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
          jwk-set-uri: https://test-fake.example.com/.well-known/jwks.json

uploads:
  dir: /tmp/lot-test-uploads

cors:
  allowed-origins: http://localhost:5173
