server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: on_param
  tomcat:
    threads:
      max: 30
      min-spare: 5
    connection-timeout: 20000
    accept-count: 100

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seed}
    username: ${SPRING_DATASOURCE_USERNAME:seed}
    password: ${SPRING_DATASOURCE_PASSWORD:seed}
    hikari:
      pool-name: HikariPool-order
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        "[default_batch_fetch_size]": 20
        "[default_schema]": orders
  # Flyway désactivé — schéma géré par catalog-service
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      properties:
        "[max.block.ms]": 3000        # fail-fast si Kafka indisponible (défaut : 60 000 ms)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:18080/realms/seed-v0}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/seed-v0/protocol/openid-connect/certs}
  jackson:
    serialization:
      write-dates-as-timestamps: false  # Dates ISO-8601 au lieu de timestamps Unix

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    "[org.springframework.security]": INFO
